<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>TaskFlow</h1>
      <p>A simple, modern, and persistent task manager</p>
    </header>

    <div class="task-input">
      <input type="text" id="task-input" placeholder="Add a new task..." />
      <input type="date" id="task-date" />
      <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button id="add-task">Add</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div class="stats">
      <p><strong>Total:</strong> <span id="total-tasks">0</span></p>
      <p><strong>Pending:</strong> <span id="pending-tasks">0</span></p>
      <p><strong>Completed:</strong> <span id="completed-tasks">0</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
